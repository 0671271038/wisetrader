<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisetrader XAUUSD</title>
<style>
body{background:#0a0f1c;color:white;font-family:sans-serif;text-align:center;padding:20px}
.card{background:#141c2f;padding:15px;border-radius:15px;margin:15px 0;border:1px solid #334}
.buy{background:#00ff88;color:#000;font-size:30px;font-weight:900;padding:25px;border-radius:20px}
.sell{background:#ff3344;color:#fff;font-size:30px;font-weight:900;padding:25px;border-radius:20px}
.wait{background:#ffcc00;color:#000;font-size:26px;font-weight:800;padding:25px;border-radius:20px}
.small{opacity:.7;font-size:12px}
button{background:#2a3a5a;color:#fff;border:0;padding:10px 15px;border-radius:10px;margin:5px}
</style>
</head>
<body>
<h1>Wisetrader 🚀<br>XAUUSD</h1>
<p>Real Gold - M5 + M1 Confirmation</p>

<div class="card">
<div>M5 Supertrend: <b id="m5">Loading...</b></div>
<div>M1 Supertrend: <b id="m1">Loading...</b></div>
<div id="price">XAUUSD: --</div>
<div class="small" id="status">Connecting...</div>
</div>

<div id="signal" class="wait">⌛ LOADING GOLD...</div>

<div class="card small">
<button onclick="changeMult(-0.5)">Mult -</button>
<span id="settings">Period 10 | Mult 3.0</span>
<button onclick="changeMult(0.5)">Mult +</button>
</div>

<script>
let mult=3.0, period=10;
function changeMult(d){mult=Math.max(1,mult+d); document.getElementById('settings').innerText=`Period ${period} | Mult ${mult}`; update();}

function calcST(candles){
  if(candles.length<20) return null;
  let atr=[], hl2=[], upper=[], lower=[], trend=[];
  for(let i=0;i<candles.length;i++){
    let h=candles[i].h, l=candles[i].l, c=candles[i].c;
    hl2[i]=(h+l)/2;
    if(i==0){atr[i]=h-l; continue;}
    let pc=candles[i-1].c;
    let tr=Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc));
    atr[i]=(atr[i-1]*(period-1)+tr)/period;
    upper[i]=hl2[i]+mult*atr[i];
    lower[i]=hl2[i]-mult*atr[i];
    if(i<2){trend[i]=true; continue;}
    if(c>upper[i-1]) trend[i]=true;
    else if(c<lower[i-1]) trend[i]=false;
    else trend[i]=trend[i-1];
    if(trend[i] && lower[i]<lower[i-1]) lower[i]=lower[i-1];
    if(!trend[i] && upper[i]>upper[i-1]) upper[i]=upper[i-1];
  }
  return trend[trend.length-1];
}

async function fetchGold(interval, limit){
  // Use PAXGUSDT = real gold, via CORS proxy to avoid block
  const url = `https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=${interval}&limit=${limit}`;
  const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
  try{
    let res = await fetch(proxy);
    let data = await res.json();
    return data.map(k=>({h:parseFloat(k[2]), l:parseFloat(k[3]), c:parseFloat(k[4])}));
  }catch(e){
    // Fallback 2: try direct
    let res2 = await fetch(url);
    let data2 = await res2.json();
    return data2.map(k=>({h:parseFloat(k[2]), l:parseFloat(k[3]), c:parseFloat(k[4])}));
  }
}

async function update(){
  document.getElementById('status').innerText="Fetching Gold candles...";
  try{
    let m5 = await fetchGold("5m", 100);
    let m1 = await fetchGold("1m", 100);
    let m5T = calcST(m5);
    let m1T = calcST(m1);
    let price = m1[m1.length-1].c;

    document.getElementById('m5').innerHTML=m5T?"🟢 BUY":"🔴 SELL";
    document.getElementById('m1').innerHTML=m1T?"🟢 BUY":"🔴 SELL";
    document.getElementById('price').innerHTML="XAUUSD Gold: $"+price.toFixed(2);
    document.getElementById('status').innerHTML="Live - Supertrend P:10 M:"+mult+" - Updates every 10s";

    let el=document.getElementById('signal');
    if(m5T && m1T){
      el.className="buy"; el.innerHTML="🟢 GOLD BUY NOW<br><span style='font-size:15px'>Go MT5 → BUY XAUUSD</span>";
    }else if(!m5T &&!m1T){
      el.className="sell"; el.innerHTML="🔴 GOLD SELL NOW<br><span style='font-size:15px'>Go MT5 → SELL XAUUSD</span>";
    }else{
      el.className="wait"; el.innerHTML="🟡 WAIT<br><span style='font-size:13px'>M5 & M1 not aligned</span>";
    }
  }catch(e){
    document.getElementById('status').innerText="Error: "+e.message+" - Retrying in 5s";
  }
}
update();
setInterval(update, 10000);
</script>
</body>
</html>
